# Deploy the website and the admin to Cloudflare static hosting (free plan; D-065, D-072).
# Manual only (Actions → "Deploy sites (Cloudflare)" → Run workflow). Never runs on push.
#
#   target = preview     → gobye-web-preview / gobye-admin-preview on a workers.dev address, to check first
#   target = production  → gobye.app / www.gobye.app and admin.gobye.app (custom domains). Before the first
#                          production run, delete the Vercel DNS records for those names in Cloudflare DNS.
#
# Repository secrets (Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   Account: Workers Scripts Edit, Account Settings Read;
#                          Zone gobye.app: Workers Routes Edit, DNS Edit (production custom domains)
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy sites (Cloudflare)
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Which site"
        type: choice
        options: [both, website, admin]
        default: both
      target:
        description: "preview = workers.dev check · production = gobye.app and admin.gobye.app"
        type: choice
        options: [preview, production]
        default: preview
permissions:
  contents: read
concurrency:
  group: deploy-sites
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.site }} → ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER: npx --yes wrangler@4.161.0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm }
      - name: Required settings present
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets:$missing"; exit 1; fi
          echo "Settings present"
      - name: Website
        if: inputs.site != 'admin'
        run: $WRANGLER deploy -c apps/web/wrangler.toml --env ${{ inputs.target }}
      - name: Build the admin (no demo tools)
        if: inputs.site != 'website'
        run: |
          npm ci --no-audit --no-fund
          npm run build -w apps/admin
          test -f apps/admin/dist/index.html
          if grep -rq "VITE_DEMO_TOOLS" apps/admin/.env* 2>/dev/null; then echo "::error::Remove VITE_DEMO_TOOLS from apps/admin env files"; exit 1; fi
      - name: Admin
        if: inputs.site != 'website'
        run: $WRANGLER deploy -c apps/admin/wrangler.toml --env ${{ inputs.target }}
      - name: Where to look
        run: |
          if [ "${{ inputs.target }}" = "preview" ]; then
            echo "Open the workers.dev addresses printed above. If they look right, run again with target = production."
          else
            echo "Live on https://gobye.app and https://admin.gobye.app (DNS can take a few minutes)."
          fi
