# GoBye public media gateway (media.gobye.app), D-051. TEMPLATE: not deployed. Pending approval of the hostname.
# Bound to the PUBLIC bucket only: it cannot read private documents or evidence. No secrets needed.
name = "gobye-media-gateway"
main = "../src/workers/media-gateway/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[env.staging]
name = "gobye-media-gateway-staging"
routes = [{ pattern = "media.staging.gobye.app/*", zone_name = "gobye.app" }]
r2_buckets = [{ binding = "PUBLIC_MEDIA", bucket_name = "gobye-staging-public-media" }]

[env.production]
name = "gobye-media-gateway"
routes = [{ pattern = "media.gobye.app/*", zone_name = "gobye.app" }]
r2_buckets = [{ binding = "PUBLIC_MEDIA", bucket_name = "gobye-prod-public-media" }]
