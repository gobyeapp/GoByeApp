# GoBye rider app in the browser (D-076), for testing on an iPhone in Safari without an Apple account.
# Built by .github/workflows/deploy-sites.yml (site = rider, target = preview): `expo export --platform web`
# into dist-web/, then served as static files. Unknown paths return index.html so Expo Router handles them.
# Preview only: never a production domain. The phone apps remain the real product.

name = "gobye-rider-web"
compatibility_date = "2026-10-01"
workers_dev = false

[assets]
directory = "./dist-web"
not_found_handling = "single-page-application"

[env.preview]
name = "gobye-rider-web-preview"
workers_dev = true
