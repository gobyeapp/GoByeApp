; Local / CI transaction-mode pooler for the C-1 regression tests (test/pooler.test.ts).
; PgBouncer is NOT Supavisor: passing here shows the API sends no session start-up parameters and
; relies on role settings + SET LOCAL, which is what transaction pooling requires. It does not prove
; Supavisor compatibility; that is checked on the staging project (STAGING_SUPABASE.md).
[databases]
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 4
; Like Supavisor: no start-up parameters beyond what PgBouncer tracks itself.
ignore_startup_parameters = extra_float_digits
server_reset_query =
logfile = pgbouncer.log
pidfile = pgbouncer.pid
unix_socket_dir =
