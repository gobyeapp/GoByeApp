# TEMPLATE: move to .github/workflows/api.yml (needs a token with the "workflow" permission to push).
# Runs the API's typecheck and tests against a real PostgreSQL, then builds the Docker image (no push).
name: API
on:
  push:
    branches: [main]
    paths: ["apps/api/**", "packages/core/**", "infra/cloudflare/src/r2/**", "package-lock.json"]
  pull_request:
    paths: ["apps/api/**", "packages/core/**", "infra/cloudflare/src/r2/**", "package-lock.json"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gobye
          POSTGRES_PASSWORD: gobye_local_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gobye" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://gobye:gobye_local_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --workspace apps/api --include-workspace-root=false --no-audit --no-fund
      - run: npm run typecheck --workspace apps/api
      - run: npm test --workspace apps/api
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile --build-arg APP_VERSION=${GITHUB_SHA::7} -t gobye-api:${GITHUB_SHA::7} .
      - name: Smoke test the image (liveness without a database)
        run: |
          docker run -d --name api -p 8080:8080 -e APP_ENV=development -e ORIGIN_AUTH_REQUIRED=false gobye-api:${GITHUB_SHA::7}
          for i in $(seq 1 30); do curl -fsS localhost:8080/health/live && break; sleep 1; done
          curl -fsS localhost:8080/health/live | grep '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/health/ready)" = "503"
          docker rm -f api
