<!doctype html>
<html lang="en-NG">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>GoBYE trust components</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { background: #fff; }
  .gallery-note { background: #fef9c3; color: #713f12; padding: 14px max(16px, env(safe-area-inset-left, 0px)); text-align: center; font-size: 14px; font-weight: 600; }
  .gallery-note code { font-weight: 700; }
</style>
</head>
<body>
<p class="gallery-note">Internal component preview with placeholder content. Not for publishing. The public page shows these blocks only when <code>trust.verified</code> in site.config.js holds real, verified data.</p>
<section class="trust" aria-labelledby="trust-title">
  <div class="trust-inner" id="trust-content"></div>
</section>
<script src="site.config.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<script>
  // Placeholders only: no invented people, quotes or ratings presented as real.
  var q = function (n) { return { quote: 'Approved customer quote ' + n + ' appears here, in the customer’s own words, exactly as they gave permission to publish.', name: 'Customer name', date: 'Month 2027', permission: true }; };
  window.GOBYE_RENDER_TRUST(document.getElementById('trust-content'), {
    count: { value: 0, label: 'Rider count label from the content model', definition: 'Metric definition shows here, for example who counts as a rider and over which dates.', asOf: 'date' },
    ratings: [
      { platform: 'Platform name', rating: 0, reviews: 0, url: 'https://example.com/' },
      { platform: 'Platform name', rating: 0, reviews: 0, url: 'https://example.com/' },
    ],
    quotes: [q(1), q(2), q(3), q(4), q(5), q(6), q(7), q(8)],
  });
</script>
</body>
</html>
